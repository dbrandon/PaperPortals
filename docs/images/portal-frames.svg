<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Standing and floor portal frames</title>
  <rect width="760" height="270" rx="16" fill="#1e1b2e"/>
  <defs>
    <g id="stone"><rect width="26" height="26" fill="#6b7280" stroke="#3f4450" stroke-width="2"/></g>
    <g id="glow"><rect width="26" height="26" fill="#a855f7" opacity="0.8"/></g>
  </defs>

  <!-- Standing frame: 4 wide x 5 tall outer, 2x3 inside -->
  <text x="190" y="34" text-anchor="middle" fill="#f5f3ff" font-size="17" font-weight="600">Standing portal</text>
  <g transform="translate(138,50)">
    <use href="#stone" x="0" y="0"/><use href="#stone" x="26" y="0"/><use href="#stone" x="52" y="0"/><use href="#stone" x="78" y="0"/>
    <use href="#stone" x="0" y="26"/><use href="#glow" x="26" y="26"/><use href="#glow" x="52" y="26"/><use href="#stone" x="78" y="26"/>
    <use href="#stone" x="0" y="52"/><use href="#glow" x="26" y="52"/><use href="#glow" x="52" y="52"/><use href="#stone" x="78" y="52"/>
    <use href="#stone" x="0" y="78"/><use href="#glow" x="26" y="78"/><use href="#glow" x="52" y="78"/><use href="#stone" x="78" y="78"/>
    <use href="#stone" x="0" y="104"/><use href="#stone" x="26" y="104"/><use href="#stone" x="52" y="104"/><use href="#stone" x="78" y="104"/>
  </g>
  <text x="190" y="210" text-anchor="middle" fill="#c4b5fd" font-size="13">Stand inside for ~2.5 seconds</text>
  <text x="190" y="228" text-anchor="middle" fill="#c4b5fd" font-size="13">(like a nether portal)</text>

  <!-- Floor frame: isometric-ish top view -->
  <text x="570" y="34" text-anchor="middle" fill="#f5f3ff" font-size="17" font-weight="600">Floor portal</text>
  <g transform="translate(570,60) scale(1,0.55) rotate(45)">
    <use href="#stone" x="0" y="0"/><use href="#stone" x="26" y="0"/><use href="#stone" x="52" y="0"/><use href="#stone" x="78" y="0"/>
    <use href="#stone" x="0" y="26"/><use href="#glow" x="26" y="26"/><use href="#glow" x="52" y="26"/><use href="#stone" x="78" y="26"/>
    <use href="#stone" x="0" y="52"/><use href="#glow" x="26" y="52"/><use href="#glow" x="52" y="52"/><use href="#stone" x="78" y="52"/>
    <use href="#stone" x="0" y="78"/><use href="#stone" x="26" y="78"/><use href="#stone" x="52" y="78"/><use href="#stone" x="78" y="78"/>
  </g>
  <text x="570" y="210" text-anchor="middle" fill="#c4b5fd" font-size="13">Step on it and you teleport</text>
  <text x="570" y="228" text-anchor="middle" fill="#c4b5fd" font-size="13">instantly — a trapdoor to anywhere</text>

  <text x="380" y="258" text-anchor="middle" fill="#8b84b0" font-size="12">Any solid block works as a frame · any shape · opening up to 441 blocks (21 × 21) · must be fully enclosed</text>
</svg>
