name: PaperPortals
version: "26.2"
main: com.tubba.mc.paper.portals.PortalPowerPlugin
api-version: "26.2"
description: Handles portals and stuff.
libraries:
  - com.google.protobuf:protobuf-java:3.25.5
commands:
    portpower:
        permission: portpower.command.use
        permission-message: "You do not have permission to run this"
        description: Paper Portal Power commands
        usage: /paperport <subcommand>
permissions:
    portpower.command.use:
        description: "Allows use of /portpower"
        default: op